<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Form 1099-DA and the missing crypto cost-basis problem</title>
  <desc id="desc">Stylized comparison bars showing gross crypto proceeds versus actual cost basis versus taxable gain, illustrating the 1099-DA basis gap.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#6d28d9" />
      <stop offset="80%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Watermark chain-link glyph -->
  <text x="1170" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700" fill="#ffffff" opacity="0.06">&#128272;</text>

  <line x1="60" y1="200" x2="1140" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Three bars: proceeds, basis, gain -->
  <g>
    <rect x="140" y="160" width="140" height="350" rx="8" fill="#c4b5fd" opacity="0.95" />
    <rect x="330" y="370" width="140" height="140" rx="8" fill="#a78bfa" opacity="0.6" stroke="#e9d5ff" stroke-dasharray="6 5" stroke-width="2" />
    <rect x="520" y="300" width="140" height="210" rx="8" fill="#8b5cf6" opacity="0.95" />
  </g>
  <text x="210" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ede9fe">$100,000</text>
  <text x="400" y="355" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#e9d5ff">$0 / ???</text>
  <text x="590" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ede9fe">$60,000</text>

  <text x="210" y="545" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ddd6fe" letter-spacing="0.3">PROCEEDS</text>
  <text x="400" y="545" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ddd6fe" letter-spacing="0.3">BASIS ON FORM</text>
  <text x="590" y="545" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ddd6fe" letter-spacing="0.3">ACTUAL GAIN</text>

  <!-- Badge -->
  <g transform="translate(940, 220)">
    <rect x="-160" y="-34" width="320" height="68" rx="34" fill="#1e1145" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.5" />
    <text x="0" y="-4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800" fill="#ede9fe" letter-spacing="0.3">FORM 1099-DA</text>
    <text x="0" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ddd6fe" letter-spacing="0.5" opacity="0.85">PROCEEDS-ONLY FOR 2025</text>
  </g>

  <g transform="translate(600, 585)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ddd6fe" letter-spacing="1.2" opacity="0.85">WALLET-BY-WALLET SINCE JAN 1, 2025</text>
  </g>
</svg>
