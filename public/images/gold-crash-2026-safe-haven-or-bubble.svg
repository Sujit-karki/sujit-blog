<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gold price chart, down about 29% from its January 2026 record</title>
  <desc id="desc">Stylized candlestick chart showing gold's decline from a record near $5,589 an ounce in January 2026 to around $4,000 by mid-July 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="35%" stop-color="#92400e" />
      <stop offset="70%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.95" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Watermark bullion glyph -->
  <circle cx="1000" cy="470" r="230" fill="#fbbf24" opacity="0.05" />
  <text x="1150" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="360" font-weight="700" fill="#fef3c7" opacity="0.07">Au</text>

  <!-- Faint grid -->
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#fef3c7" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="250" x2="1140" y2="250" stroke="#fef3c7" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="320" x2="1140" y2="320" stroke="#fef3c7" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="390" x2="1140" y2="390" stroke="#fef3c7" stroke-opacity="0.08" stroke-width="1" />

  <!-- Candlesticks: sharp rise into the peak, then a hard decline -->
  <g>
    <line x1="90" y1="260" x2="90" y2="300" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="82" y="268" width="16" height="24" rx="2.5" fill="#fde68a" opacity="0.9" />
    <line x1="144" y1="220" x2="144" y2="260" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="136" y="228" width="16" height="24" rx="2.5" fill="#fde68a" opacity="0.9" />
    <line x1="198" y1="175" x2="198" y2="215" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="190" y="183" width="16" height="24" rx="2.5" fill="#fde68a" opacity="0.9" />
    <line x1="252" y1="132" x2="252" y2="172" stroke="#fbbf24" stroke-width="2" opacity="0.6" />
    <rect x="244" y="140" width="16" height="24" rx="2.5" fill="#fbbf24" opacity="0.95" />
    <line x1="306" y1="128" x2="306" y2="168" stroke="#fbbf24" stroke-width="2" opacity="0.6" />
    <rect x="298" y="136" width="16" height="24" rx="2.5" fill="#fbbf24" opacity="0.95" />

    <line x1="414" y1="160" x2="414" y2="200" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="406" y="168" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="468" y1="205" x2="468" y2="245" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="460" y="213" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="522" y1="250" x2="522" y2="290" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="514" y="258" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="576" y1="290" x2="576" y2="330" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="568" y="298" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="630" y1="325" x2="630" y2="365" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="622" y="333" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="684" y1="355" x2="684" y2="395" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="676" y="363" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="738" y1="380" x2="738" y2="420" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="730" y="388" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />
    <line x1="792" y1="400" x2="792" y2="440" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <rect x="784" y="408" width="16" height="24" rx="2.5" fill="#f87171" opacity="0.9" />

    <line x1="846" y1="415" x2="846" y2="450" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="838" y="422" width="16" height="22" rx="2.5" fill="#fbbf24" opacity="0.9" />
    <line x1="900" y1="405" x2="900" y2="440" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="892" y="412" width="16" height="22" rx="2.5" fill="#34d399" opacity="0.85" />
    <line x1="954" y1="410" x2="954" y2="445" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="946" y="417" width="16" height="22" rx="2.5" fill="#34d399" opacity="0.85" />
    <line x1="1008" y1="408" x2="1008" y2="443" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="1000" y="415" width="16" height="22" rx="2.5" fill="#fbbf24" opacity="0.9" />
    <line x1="1062" y1="412" x2="1062" y2="447" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="1054" y="419" width="16" height="22" rx="2.5" fill="#34d399" opacity="0.85" />
    <line x1="1110" y1="410" x2="1110" y2="445" stroke="#fde68a" stroke-width="2" opacity="0.55" />
    <rect x="1102" y="417" width="16" height="22" rx="2.5" fill="#34d399" opacity="0.85" />
  </g>

  <!-- Overlaid price line -->
  <polyline points="90,280 144,240 198,195 252,152 306,148 414,180 468,225 522,270 576,310 630,345 684,375 738,400 792,420 846,433 900,423 954,428 1008,426 1062,430 1110,428" fill="none" stroke="url(#lineFade)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)" opacity="0.9" />

  <!-- Peak label -->
  <g transform="translate(252, 122)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fef9c3" letter-spacing="0.5">PEAK $5,589</text>
  </g>

  <!-- Drawdown badge -->
  <g transform="translate(738, 480)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1c0a02" fill-opacity="0.55" stroke="#f87171" stroke-opacity="0.5" />
    <text x="0" y="5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fca5a5" letter-spacing="0.3">DOWN ~29%</text>
  </g>

  <!-- Current label -->
  <g transform="translate(1110, 393)">
    <text text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#bbf7d0" letter-spacing="0.5">~$4,000, JUL '26</text>
  </g>
</svg>
