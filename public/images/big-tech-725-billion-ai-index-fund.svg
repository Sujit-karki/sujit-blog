<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Big tech will spend $725 billion on AI in 2026</title>
  <desc id="desc">Stylized rising bar chart of hyperscaler AI capital expenditure climbing from about $410 billion in 2025 to about $725 billion in 2026, with a badge for S&amp;P 500 concentration.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#065f46" />
      <stop offset="80%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="1150" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="340" font-weight="700" fill="#ffffff" opacity="0.06">$</text>

  <line x1="60" y1="480" x2="1140" y2="480" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Four company bars + a taller combined bar, rising left to right -->
  <g fill="#34d399">
    <rect x="120" y="360" width="90" height="120" rx="4" opacity="0.85" />
    <rect x="260" y="330" width="90" height="150" rx="4" opacity="0.85" />
    <rect x="400" y="310" width="90" height="170" rx="4" opacity="0.85" />
    <rect x="540" y="380" width="90" height="100" rx="4" opacity="0.85" />
  </g>
  <rect x="740" y="200" width="140" height="280" rx="4" fill="#6ee7b7" />

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">
    <text x="165" y="500" text-anchor="middle">AMZN</text>
    <text x="305" y="500" text-anchor="middle">GOOGL</text>
    <text x="445" y="500" text-anchor="middle">MSFT</text>
    <text x="585" y="500" text-anchor="middle">META</text>
    <text x="810" y="500" text-anchor="middle">COMBINED</text>
  </g>

  <g transform="translate(810, 175)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$725B</text>
  </g>

  <g transform="translate(950, 130)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#6ee7b7" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0" letter-spacing="0.3">UP ~77% FROM 2025</text>
  </g>

  <g transform="translate(220, 540)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#6ee7b7" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a7f3d0" letter-spacing="0.3">MAG 7 = ~32.5% OF S&amp;P 500</text>
  </g>

  <g transform="translate(600, 580)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#d1fae5" letter-spacing="1" opacity="0.85">YOUR INDEX FUND OWNS THIS BET WHETHER YOU CHOSE IT OR NOT</text>
  </g>
</svg>
