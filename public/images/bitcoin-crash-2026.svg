<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin price chart, down about 48% from its October 2025 peak</title>
  <desc id="desc">Stylized candlestick chart showing Bitcoin's decline from its October 2025 peak near $126,000 to around $65,000 in July 2026, with a partial recovery visible at the right edge.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
