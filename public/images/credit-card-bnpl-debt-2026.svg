<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">US credit card debt hit a record $1.277 trillion in 2026</title>
  <desc id="desc">Stylized rising red line chart of total US credit card debt climbing to a record $1.277 trillion before a slight dip, with badges for the average balance and APR.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="45%" stop-color="#7f1d1d" />
      <stop offset="80%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="1150" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="360" font-weight="700" fill="#ffffff" opacity="0.06">$</text>

  <line x1="60" y1="180" x2="1140" y2="180" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="270" x2="1140" y2="270" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="450" x2="1140" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Rising debt line to the record, then a small seasonal dip -->
  <polyline points="90,470 220,440 350,405 480,365 610,320 740,270 850,225 960,190 1040,178 1100,196"
    fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.95" />
  <circle cx="1040" cy="178" r="7" fill="#ffffff" />
  <circle cx="1040" cy="178" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
  <circle cx="1100" cy="196" r="6" fill="#fca5a5" />

  <g transform="translate(1040, 150)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fecaca" letter-spacing="0.4">RECORD $1.277T</text>
  </g>
  <g transform="translate(1100, 226)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e7e5e4" letter-spacing="0.3">NOW $1.252T</text>
  </g>

  <g transform="translate(240, 130)">
    <rect x="-118" y="-24" width="236" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fca5a5" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fecaca" letter-spacing="0.3">AVG BALANCE $6,519</text>
  </g>

  <g transform="translate(240, 500)">
    <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#fed7aa" letter-spacing="0.3">21% AVG APR</text>
  </g>

  <g transform="translate(600, 566)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fee2e2" letter-spacing="1.2" opacity="0.85">$253.37B PAID IN INTEREST &amp; FEES, 2025</text>
  </g>
</svg>
