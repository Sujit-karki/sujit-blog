<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The $10,000 car loan interest deduction versus record vehicle prices</title>
  <desc id="desc">Stylized rising line chart of new-vehicle transaction prices reaching $49,758 in June 2026, alongside a $10,000 auto-loan interest deduction badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="45%" stop-color="#c2410c" />
      <stop offset="80%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Watermark car glyph -->
  <text x="1170" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700" fill="#ffffff" opacity="0.06">&#128663;</text>

  <!-- Faint grid -->
  <line x1="60" y1="200" x2="1140" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- ATP price trend line -->
  <polyline points="120,470 260,440 400,455 540,448 680,452 820,300" fill="none" stroke="#fdba74" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.95" />
  <circle cx="120" cy="470" r="6" fill="#fed7aa" />
  <circle cx="820" cy="300" r="8" fill="#ffffff" />

  <g transform="translate(120, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fed7aa" letter-spacing="0.3">DEC '25</text>
  </g>
  <g transform="translate(820, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffedd5" letter-spacing="0.3">JUN '26</text>
  </g>

  <!-- ATP badge -->
  <g transform="translate(900, 220)">
    <rect x="-155" y="-32" width="310" height="64" rx="32" fill="#2a0a02" fill-opacity="0.55" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="-4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffedd5" letter-spacing="0.3">$49,758 AVG. NEW-CAR PRICE</text>
    <text x="0" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fed7aa" letter-spacing="0.5" opacity="0.85">COX AUTOMOTIVE, JUNE 2026</text>
  </g>

  <!-- Deduction badge -->
  <g transform="translate(900, 370)">
    <rect x="-120" y="-26" width="240" height="52" rx="26" fill="#2a0a02" fill-opacity="0.55" stroke="#fed7aa" stroke-opacity="0.5" />
    <text x="0" y="7" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffedd5" letter-spacing="0.3">UP TO $10,000 DEDUCTIBLE</text>
  </g>

  <g transform="translate(600, 585)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fed7aa" letter-spacing="1.2" opacity="0.85">OBBBA — TAX YEARS 2025-2028</text>
  </g>
</svg>
