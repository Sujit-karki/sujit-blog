<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stablecoins hit a $303 billion market cap, but the GENIUS Act bans holder yield</title>
  <desc id="desc">Stylized coin ring split between a large dollar-pegged token and smaller tokens, with the yield flowing away from the holder to the issuer, and badges for the market cap and the 0% yield to holders.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="45%" stop-color="#4c1d95" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="1160" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="360" font-weight="700" fill="#ffffff" opacity="0.06">$</text>

  <!-- Coin ring -->
  <circle cx="330" cy="345" r="150" fill="none" stroke="#c4b5fd" stroke-width="6" opacity="0.9" filter="url(#soft)" />
  <circle cx="330" cy="345" r="150" fill="none" stroke="#a78bfa" stroke-width="18" stroke-dasharray="330 471" stroke-linecap="round" transform="rotate(-90 330 345)" opacity="0.55" />
  <text x="330" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700" fill="#ede9fe">$1</text>

  <!-- Yield arrow flowing away from the coin to the issuer -->
  <path d="M470 300 C 620 240, 760 240, 900 290" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" />
  <path d="M885 278 L905 292 L887 306" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <g transform="translate(690, 232)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" letter-spacing="0.4">RESERVE YIELD ~4.3%</text>
  </g>
  <g transform="translate(950, 320)">
    <rect x="-56" y="-24" width="112" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#6ee7b7" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">ISSUER</text>
  </g>

  <g transform="translate(240, 130)">
    <rect x="-110" y="-24" width="220" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ede9fe" letter-spacing="0.3">$303B MARKET CAP</text>
  </g>

  <g transform="translate(600, 566)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ede9fe" letter-spacing="1.2" opacity="0.85">0% YIELD TO HOLDERS BY LAW — GENIUS ACT</text>
  </g>
</svg>
