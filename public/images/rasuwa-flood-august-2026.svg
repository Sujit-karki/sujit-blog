<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-title rf-desc">
  <title id="rf-title">The August 2026 Rasuwa flood: a glacier collapse above 5,200 metres and the debris flow it sent down the Trishuli valley</title>
  <desc id="rf-desc">Stylised Himalayan valley cross-section. An ice mass detaches from a high glacier on the left, blocks the river, and releases a surge of mud and debris that runs down the valley past riverside settlements on the right. Marked with the headline figures: magnitude 5.2, 0.2 square kilometres of ice, a 9 metre rise in 30 minutes, and damage above 200 billion rupees.</desc>

  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="dawn" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rockFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="rockNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="surge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)" />
  <rect width="1200" height="630" fill="url(#dawn)" />

  <!-- Far ridge line -->
  <path d="M 0 300 L 90 210 L 170 262 L 250 178 L 330 250 L 430 196 L 520 268 L 620 232 L 720 286 L 830 246 L 940 300 L 1060 268 L 1200 316 L 1200 630 L 0 630 Z" fill="url(#rockFar)" opacity="0.55" />

  <!-- Snow caps on the far ridge -->
  <path d="M 250 178 L 285 210 L 215 210 Z" fill="#e2e8f0" opacity="0.6" />
  <path d="M 430 196 L 462 226 L 398 226 Z" fill="#e2e8f0" opacity="0.5" />

  <!-- Main valley wall, left (the detachment side) -->
  <path d="M 0 630 L 0 380 L 120 268 L 230 196 L 330 150 L 400 210 L 470 300 L 540 390 L 620 470 L 700 540 L 780 600 L 820 630 Z" fill="url(#rockNear)" />

  <!-- Glacier at the detachment zone -->
  <path d="M 300 150 L 380 196 L 352 236 L 268 190 Z" fill="url(#ice)" opacity="0.95" />
  <path d="M 330 150 L 400 210 L 372 224 L 306 166 Z" fill="#ffffff" opacity="0.35" />

  <!-- The detaching block: slides down and fades, on a loop -->
  <g>
    <path d="M 352 190 L 404 224 L 386 258 L 334 226 Z" fill="url(#ice)" stroke="#e0f2fe" stroke-width="2" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 96; 150 240" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.95;0.8;0" dur="4.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Right valley wall -->
  <path d="M 1200 630 L 1200 340 L 1090 300 L 990 336 L 900 396 L 820 456 L 750 512 L 690 566 L 650 630 Z" fill="url(#rockNear)" opacity="0.92" />

  <!-- The debris flow filling the valley floor -->
  <path d="M 330 214 L 470 330 L 600 430 L 720 512 L 840 578 L 960 630 L 400 630 L 300 540 L 250 440 L 250 300 Z" fill="url(#surge)" opacity="0.9" />
  <path d="M 330 214 L 470 330 L 600 430 L 720 512 L 840 578 L 960 630 L 400 630 L 300 540 L 250 440 L 250 300 Z" fill="url(#surge)" opacity="0.35" filter="url(#blur6)" />

  <!-- Moving crests inside the flow -->
  <g opacity="0.55">
    <path d="M 300 300 Q 380 340 450 400 Q 520 460 600 520" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round" stroke-dasharray="26 40">
      <animate attributeName="stroke-dashoffset" values="0;-132" dur="1.6s" repeatCount="indefinite" />
    </path>
    <path d="M 350 258 Q 440 320 520 390 Q 610 466 700 540" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 46">
      <animate attributeName="stroke-dashoffset" values="0;-128" dur="2.1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Riverside settlement being overtaken, right of centre -->
  <g opacity="0.9">
    <rect x="880" y="472" width="34" height="30" fill="#e2e8f0" opacity="0.85" />
    <path d="M 874 472 L 897 456 L 920 472 Z" fill="#94a3b8" />
    <rect x="928" y="484" width="28" height="24" fill="#cbd5e1" opacity="0.8" />
    <path d="M 922 484 L 942 470 L 962 484 Z" fill="#94a3b8" />
    <rect x="838" y="486" width="26" height="22" fill="#e2e8f0" opacity="0.7" />
    <path d="M 832 486 L 851 472 L 870 486 Z" fill="#94a3b8" />
  </g>

  <!-- Rising water line over the settlement -->
  <rect x="800" y="470" width="200" height="160" fill="#b91c1c" opacity="0.0">
    <animate attributeName="opacity" values="0;0.55;0.55;0" dur="4.5s" repeatCount="indefinite" />
  </rect>

  <!-- Headline block -->
  <text x="70" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fca5a5" letter-spacing="4">RASUWA · AUGUST 26, 2026</text>
  <text x="70" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff">A glacier broke.</text>
  <text x="70" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff">A valley had 30 minutes.</text>

  <!-- Figure strip -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">
    <rect x="66" y="500" width="1068" height="72" rx="14" fill="#0f172a" opacity="0.62" />
    <g fill="#ffffff">
      <text x="98" y="530" font-size="26" font-weight="700">M 5.2</text>
      <text x="98" y="552" font-size="13" fill="#cbd5e1">seismic trigger</text>

      <text x="330" y="530" font-size="26" font-weight="700">0.2 km²</text>
      <text x="330" y="552" font-size="13" fill="#cbd5e1">of ice detached</text>

      <text x="590" y="530" font-size="26" font-weight="700">9 m / 30 min</text>
      <text x="590" y="552" font-size="13" fill="#cbd5e1">river level surge</text>

      <text x="890" y="530" font-size="26" font-weight="700">Rs 200bn+</text>
      <text x="890" y="552" font-size="13" fill="#cbd5e1">preliminary damage</text>
    </g>
  </g>
</svg>
