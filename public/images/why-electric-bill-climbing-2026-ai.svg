<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why electric bills keep climbing in 2026</title>
  <desc id="desc">Stylized rising line of residential electricity prices climbing toward 18.2 cents per kilowatt-hour, with a lightning-bolt motif for AI data center demand.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="45%" stop-color="#9a3412" />
      <stop offset="80%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Bolt watermark -->
  <path d="M900 60 L800 280 L880 280 L820 480 L1020 220 L930 220 Z" fill="#ffffff" opacity="0.05" />

  <line x1="60" y1="200" x2="1140" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="320" x2="1140" y2="320" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="440" x2="1140" y2="440" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <polyline points="90,430 300,410 520,380 740,320 940,250 1100,210"
    fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.95" />
  <circle cx="1100" cy="210" r="7" fill="#ffffff" />
  <circle cx="1100" cy="210" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

  <g transform="translate(1040, 180)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fed7aa" letter-spacing="0.4">18.2¢/kWh IN 2026</text>
  </g>

  <g transform="translate(240, 130)">
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#fed7aa" letter-spacing="0.3">UP NEARLY 5% YoY</text>
  </g>

  <g transform="translate(240, 500)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fed7aa" letter-spacing="0.3">AI DATA CENTERS: PART OF IT</text>
  </g>

  <g transform="translate(600, 566)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff7ed" letter-spacing="1.2" opacity="0.85">MARKET DESIGN IS THE OTHER PART OF THE STORY</text>
  </g>
</svg>
