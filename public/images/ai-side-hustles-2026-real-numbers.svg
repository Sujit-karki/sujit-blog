<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The real AI side hustle earnings ladder for 2026</title>
  <desc id="desc">Stylized ascending bar chart showing three tiers of AI side hustle income: beginner around $750 a month, established niche around $5,500 a month, and top tier around $17,500 a month.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="40%" stop-color="#134e4a" />
      <stop offset="75%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Watermark spark/AI glyph -->
  <text x="1160" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="360" font-weight="700" fill="#ffffff" opacity="0.06">&#10022;</text>

  <!-- Faint grid -->
  <line x1="60" y1="200" x2="1140" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Three ascending bars: beginner, established, top tier -->
  <g>
    <rect x="150" y="440" width="130" height="70" rx="8" fill="#34d399" opacity="0.85" />
    <rect x="380" y="330" width="130" height="180" rx="8" fill="#22d3ee" opacity="0.88" />
    <rect x="610" y="165" width="130" height="345" rx="8" fill="#818cf8" opacity="0.95" />
  </g>

  <!-- Connecting trend line -->
  <polyline points="215,435 445,325 675,160" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.85" />
  <circle cx="215" cy="435" r="6" fill="#ffffff" />
  <circle cx="445" cy="325" r="6" fill="#ffffff" />
  <circle cx="675" cy="160" r="6" fill="#ffffff" />

  <!-- Bar value labels -->
  <g transform="translate(215, 420)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#d1fae5" letter-spacing="0.3">$750/MO</text>
  </g>
  <g transform="translate(445, 310)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#cffafe" letter-spacing="0.3">$5,500/MO</text>
  </g>
  <g transform="translate(675, 145)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#e0e7ff" letter-spacing="0.3">$17,500/MO</text>
  </g>

  <!-- Tier labels -->
  <g transform="translate(215, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="0.4">BEGINNER</text>
  </g>
  <g transform="translate(445, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5f3fc" letter-spacing="0.4">ESTABLISHED</text>
  </g>
  <g transform="translate(675, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe" letter-spacing="0.4">TOP TIER</text>
  </g>

  <!-- Earnings premium badge -->
  <g transform="translate(950, 220)">
    <rect x="-140" y="-30" width="280" height="60" rx="30" fill="#0a1220" fill-opacity="0.55" stroke="#5eead4" stroke-opacity="0.5" />
    <text x="0" y="-2" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#99f6e4" letter-spacing="0.3">+34% PER HOUR</text>
    <text x="0" y="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.5" opacity="0.85">FOR AI-RELATED WORK</text>
  </g>

  <!-- Source line -->
  <g transform="translate(600, 580)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" letter-spacing="1.2" opacity="0.85">REAL NUMBERS, NOT HYPE</text>
  </g>
</svg>
