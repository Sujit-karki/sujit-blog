<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Crypto is coming to 401(k)s but the DOL rule is not final yet</title>
  <desc id="desc">Stylized stacked bars representing a retirement account with a small highlighted crypto sleeve, and a dashed outline slice marked proposed but not final.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#4c1d95" />
      <stop offset="80%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#0c0a1a" />
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="1150" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700" fill="#ffffff" opacity="0.06">?</text>

  <!-- 401(k) stack: core holdings, with a thin dashed "proposed" crypto sleeve on top -->
  <g transform="translate(280, 300)">
    <rect x="-90" y="-160" width="180" height="160" rx="6" fill="#a78bfa" fill-opacity="0.85" />
    <rect x="-90" y="-200" width="180" height="34" rx="6" fill="none" stroke="#f5d0fe" stroke-width="3" stroke-dasharray="6 6" />
    <text x="0" y="-183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5d0fe">PROPOSED SLEEVE</text>
    <text x="0" y="-60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" opacity="0.9">CORE 401(K)</text>
  </g>

  <g transform="translate(230, 130)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#0c0a1a" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e9d5ff" letter-spacing="0.3">PROPOSED, NOT FINAL</text>
  </g>

  <g transform="translate(700, 460)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#0c0a1a" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e9d5ff" letter-spacing="0.3">$48.1T RETIREMENT MARKET</text>
  </g>

  <g transform="translate(850, 220)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ddd6fe" letter-spacing="0.4">DOL RULE — MARCH 30, 2026</text>
  </g>

  <g transform="translate(600, 566)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ede9fe" letter-spacing="1.2" opacity="0.85">NO PLAN IS REQUIRED TO ADD CRYPTO — YOUR FIDUCIARY STILL DECIDES</text>
  </g>
</svg>
