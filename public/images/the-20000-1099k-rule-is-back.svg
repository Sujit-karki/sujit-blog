<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The $20,000 1099-K threshold is back for 2026</title>
  <desc id="desc">Stylized line showing the 1099-K reporting threshold dropping toward $600 then snapping back up to $20,000, with badges for the transaction count rule.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="45%" stop-color="#78350f" />
      <stop offset="80%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="1150" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="340" font-weight="700" fill="#ffffff" opacity="0.06">K</text>

  <line x1="60" y1="180" x2="1140" y2="180" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="420" x2="1140" y2="420" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Threshold: high in 2021, dropping toward $600 through 2024-25, then snapping back to $20,000 -->
  <polyline points="90,200 260,215 420,260 560,420 700,470 760,460 820,320 900,220 980,190 1100,188"
    fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.95" />
  <circle cx="700" cy="470" r="6" fill="#fdba74" />
  <circle cx="1100" cy="188" r="7" fill="#ffffff" />
  <circle cx="1100" cy="188" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

  <g transform="translate(700, 512)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fed7aa" letter-spacing="0.3">FEARED: $600</text>
  </g>
  <g transform="translate(1050, 150)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fed7aa" letter-spacing="0.4">BACK TO $20,000</text>
  </g>

  <g transform="translate(230, 120)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#fed7aa" letter-spacing="0.3">OBBBA RESTORED $20,000</text>
  </g>

  <g transform="translate(220, 500)">
    <rect x="-118" y="-24" width="236" height="48" rx="24" fill="#0c0a09" fill-opacity="0.6" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#fed7aa" letter-spacing="0.3">PLUS 200 TRANSACTIONS</text>
  </g>

  <g transform="translate(600, 566)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fef3c7" letter-spacing="1.2" opacity="0.85">A FORM IS NOT A TAX BILL — YOU STILL OWE ON PROFIT</text>
  </g>
</svg>
