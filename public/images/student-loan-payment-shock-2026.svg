<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Student loan defaults climbing sharply as RAP replaces SAVE in 2026</title>
  <desc id="desc">Stylized bar chart showing newly defaulted student loan borrowers climbing from about 1 million in Q4 2025 to 2.6 million in Q1 2026, with RAP and default-count callouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#9a3412" />
      <stop offset="75%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Watermark graduation cap glyph -->
  <text x="1160" y="600" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="360" font-weight="700" fill="#ffffff" opacity="0.06">&#127891;</text>

  <!-- Faint grid -->
  <line x1="60" y1="200" x2="1140" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="300" x2="1140" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Six ascending bars representing the accelerating default wave -->
  <g>
    <rect x="120" y="430" width="70" height="80" rx="6" fill="#fdba74" opacity="0.85" />
    <rect x="230" y="400" width="70" height="110" rx="6" fill="#fb923c" opacity="0.85" />
    <rect x="340" y="355" width="70" height="155" rx="6" fill="#f97316" opacity="0.88" />
    <rect x="450" y="300" width="70" height="210" rx="6" fill="#ef4444" opacity="0.9" />
    <rect x="560" y="230" width="70" height="280" rx="6" fill="#ef4444" opacity="0.95" />
    <rect x="670" y="150" width="70" height="360" rx="6" fill="#dc2626" opacity="1" />
  </g>

  <!-- Trend line over the bars -->
  <polyline points="155,440 265,410 375,365 485,310 595,240 705,160" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.9" />
  <circle cx="705" cy="160" r="7" fill="#ffffff" />

  <!-- Q4 2025 label -->
  <g transform="translate(155, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fed7aa" letter-spacing="0.3">Q4 '25</text>
  </g>
  <!-- Q1 2026 label -->
  <g transform="translate(705, 528)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fecaca" letter-spacing="0.3">Q1 '26</text>
  </g>

  <!-- Default count badge -->
  <g transform="translate(910, 200)">
    <rect x="-140" y="-30" width="280" height="60" rx="30" fill="#0f0a08" fill-opacity="0.55" stroke="#f87171" stroke-opacity="0.5" />
    <text x="0" y="-2" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fecaca" letter-spacing="0.3">3.6M NEWLY DEFAULTED</text>
    <text x="0" y="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fed7aa" letter-spacing="0.5" opacity="0.85">ACROSS TWO QUARTERS</text>
  </g>

  <!-- RAP badge -->
  <g transform="translate(910, 340)">
    <rect x="-105" y="-24" width="210" height="48" rx="24" fill="#0f0a08" fill-opacity="0.55" stroke="#fdba74" stroke-opacity="0.5" />
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fed7aa" letter-spacing="0.3">RAP: A 30-YEAR PLAN</text>
  </g>

  <!-- Effective date -->
  <g transform="translate(600, 580)">
    <text text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fdba74" letter-spacing="1.2" opacity="0.85">EFFECTIVE JULY 1, 2026</text>
  </g>
</svg>
